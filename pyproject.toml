[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttdl2"
version = "2.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
description = "TikTok Downloader, second edition: Python, Qt and Playwright"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "playwright>=1.51,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
ttdl2 = "tiktok_downloader.app:main"

[tool.hatch.build.targets.wheel]
packages = ["tiktok_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
